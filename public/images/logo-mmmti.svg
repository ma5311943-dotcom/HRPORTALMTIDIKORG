<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Mufti Mehmood Memorial Medical Teaching Institution">
  <defs>
    <linearGradient id="mm-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#046a38"/>
      <stop offset="1" stop-color="#01411c"/>
    </linearGradient>
    <linearGradient id="mm-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#d4a017"/>
      <stop offset="1" stop-color="#a16207"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="96" fill="#ffffff" stroke="url(#mm-gold)" stroke-width="6"/>
  <circle cx="100" cy="100" r="88" fill="url(#mm-green)"/>
  <circle cx="100" cy="100" r="66" fill="#ffffff" stroke="url(#mm-gold)" stroke-width="3"/>
  <!-- Red crescent ring -->
  <circle cx="100" cy="98" r="50" fill="none" stroke="#b91c1c" stroke-width="10"/>
  <!-- Rod of Asclepius -->
  <line x1="100" y1="58" x2="100" y2="140" stroke="#01411c" stroke-width="6" stroke-linecap="round"/>
  <circle cx="100" cy="56" r="6" fill="url(#mm-gold)"/>
  <path d="M86 78 C116 72 116 96 90 100 C70 104 118 116 112 130" fill="none" stroke="#d4a017" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M114 78 C84 72 84 96 110 100 C130 104 82 116 88 130" fill="none" stroke="#046a38" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Bottom label -->
  <rect x="48" y="152" width="104" height="22" rx="6" fill="#ffffff" stroke="url(#mm-gold)" stroke-width="2"/>
  <text x="100" y="168" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#01411c" text-anchor="middle" letter-spacing="1.5">MMMTI</text>
</svg>
