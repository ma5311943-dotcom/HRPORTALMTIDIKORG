<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="District Headquarters Teaching Hospital">
  <defs>
    <linearGradient id="dq-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="dq-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#eab308"/>
      <stop offset="1" stop-color="#a16207"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="96" fill="#ffffff" stroke="url(#dq-gold)" stroke-width="6"/>
  <circle cx="100" cy="100" r="88" fill="url(#dq-green)"/>
  <circle cx="100" cy="100" r="66" fill="#ffffff" stroke="url(#dq-gold)" stroke-width="3"/>
  <!-- Medical cross -->
  <path d="M86 52 H114 V84 H146 V112 H114 V144 H86 V112 H54 V84 H86 Z" fill="#b91c1c" stroke="url(#dq-gold)" stroke-width="3" transform="translate(0,-6) scale(1)"/>
  <circle cx="100" cy="92" r="9" fill="#ffffff"/>
  <circle cx="100" cy="92" r="4.5" fill="#064e3b"/>
  <!-- Bottom label -->
  <rect x="56" y="152" width="88" height="22" rx="6" fill="#ffffff" stroke="url(#dq-gold)" stroke-width="2"/>
  <text x="100" y="168" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#064e3b" text-anchor="middle" letter-spacing="1.5">DHQ</text>
</svg>
