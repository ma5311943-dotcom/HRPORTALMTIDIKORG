  <path d="M93 150 H107 M100 143 V157" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <!-- Laurels -->
  <path d="M36 104 C34 130 52 154 76 164" fill="none" stroke="url(#ds-gold)" stroke-width="3" stroke-linecap="round"/>
