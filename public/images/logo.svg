      <stop offset="0" stop-color="#046a38"/>
      <stop offset="1" stop-color="#01411c"/>
    </linearGradient>
    <linearGradient id="ds-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
